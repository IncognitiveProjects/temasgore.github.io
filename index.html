<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temas Goreros | Galería de Temas Forogore</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Creepster&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            background-image: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            font-family: 'Special Elite', cursive; /* Fuente tipo máquina de escribir */
            margin: 0;
            padding: 0;
            color: #a0a0a0;
        }
        header {
            text-align: center;
            padding: 50px 20px;
            border-bottom: 2px dashed #4a0000;
            background-color: rgba(10, 0, 0, 0.8);
            box-shadow: 0 10px 30px rgba(139, 0, 0, 0.3);
        }
        h1 {
            font-family: 'Creepster', cursive; /* Fuente de terror */
            color: #b30000;
            margin: 0;
            font-size: 3.5em;
            letter-spacing: 5px;
            text-shadow: 0 0 15px #ff0000;
        }
        .subtitulo {
            color: #666;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 10px;
        }
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .tarjeta {
            background-color: #111;
            border: 1px solid #330000;
            border-radius: 2px;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .tarjeta:hover {
            transform: scale(1.02);
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(179, 0, 0, 0.6);
        }
        .tarjeta img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 2px solid #330000;
            filter: grayscale(80%) contrast(120%); /* Le da un toque más oscuro a la foto */
            transition: filter 0.3s;
        }
        .tarjeta:hover img {
            filter: grayscale(0%) contrast(100%);
        }
        .contenido {
            padding: 20px;
        }
        .contenido h2 {
            color: #e0e0e0;
            margin: 0 0 10px 0;
            font-size: 1.4em;
            text-transform: uppercase;
        }
        .etiqueta {
            color: #ff3333;
            font-size: 0.8em;
            margin-bottom: 20px;
            display: inline-block;
        }
        .boton {
            display: block;
            text-align: center;
            background-color: #330000;
            color: #ffcccc;
            text-decoration: none;
            padding: 12px;
            border: 1px solid #8b0000;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        .boton:hover {
            background-color: #b30000;
            color: white;
            box-shadow: 0 0 15px #ff0000;
        }
    </style>
</head>
<body>

    <header>
        <h1>Temas Goreros</h1>
        <p class="subtitulo">Temas visuales para tu foro</p>
    </header>

    <div class="galeria">

        <!-- 👇 COPIA ESTE BLOQUE COMPLETO PARA AÑADIR MÁS TEMAS 👇 -->
        <div class="tarjeta">
            <!-- PON LA IMAGEN AQUÍ -->
            <img src="https://i.postimg.cc/d0qFbVZf/cute.png" alt="Tema">
            <div class="contenido">
                <h2>Cute Gore V1.0</h2>
                <span class="etiqueta">#Cute #Otaku</span>
                <!-- IMPORTANTE: El enlace lleva a la subpágina "tema1.html" -->
                <a href="tema1.html" class="boton">Ver Guía Instalación</a>
            </div>
        </div>
        <!-- ☝️ FIN DEL BLOQUE ☝️ -->

                <!-- 👇 COPIA ESTE BLOQUE COMPLETO PARA AÑADIR MÁS TEMAS 👇 -->
        <div class="tarjeta">
            <!-- PON LA IMAGEN AQUÍ -->
            <img src="https://i.postimg.cc/d0qFbVZf/cute.png" alt="Tema">
            <div class="contenido">
                <h2>Forogore 2021 V1.0</h2>
                <span class="etiqueta">#Antiguo #OldVersion</span>
                <!-- IMPORTANTE: El enlace lleva a la subpágina "tema1.html" -->
                <a href="tema1.html" class="boton">Ver Guía Instalación</a>
            </div>
        </div>
        <!-- ☝️ FIN DEL BLOQUE ☝️ -->

        <div class="tarjeta">
            <img src="https://i.postimg.cc/dt6c8KfP/Captura-de-pantalla-de-2026-10-23-18-23-07.png" alt="Tema 2">
            <div class="contenido">
                <h2>Modern Foro V1.0</h2>
                <span class="etiqueta">#Gore #Moderno</span>
                <!-- Aquí tendrías que crear un tema2.html luego -->
                <a href="tema1.html" class="boton">Ver Guía Instalación</a>
            </div>
        </div>

    </div>
</body>
</html>
