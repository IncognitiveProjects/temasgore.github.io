<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temas Gore & Kawaii</title>
    <style>
        /* --- DISEÑO DE LA PÁGINA --- */
        body {
            background-color: #ffe6f0; /* Fondo rosa pastel */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        header {
            text-align: center;
            padding: 30px;
            background-color: #ff99cc;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: 3px dashed #fff;
        }
        h1 {
            color: white;
            text-shadow: 2px 2px 4px #ff4d94;
            margin: 0;
            font-size: 2.5em;
        }
        .subtitulo {
            color: #fff;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 10px;
        }
        /* Cuadrícula donde van las tarjetas */
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Diseño de cada tarjeta */
        .tarjeta {
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(255, 153, 204, 0.4);
            transition: transform 0.3s;
            border: 2px solid #ffccdd;
        }
        .tarjeta:hover {
            transform: translateY(-5px); /* Se mueve un poquito al pasar el mouse */
        }
        .tarjeta img {
            width: 100%;
            height: 180px;
            object-fit: cover; /* Ajusta la imagen para que no se deforme */
            border-bottom: 2px solid #ffccdd;
            background-color: #eee;
        }
        .contenido {
            padding: 15px;
        }
        .contenido h2 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
            color: #ff4d94;
            text-align: center;
        }
        .etiqueta {
            background-color: #ffe6f0;
            color: #ff4d94;
            font-size: 0.8em;
            padding: 4px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .boton-descarga {
            display: block;
            text-align: center;
            background-color: #ff4d94;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .boton-descarga:hover {
            background-color: #d93673;
        }
    </style>
</head>
<body>

    <header>
        <h1>☠️ Temas Visuales ☠️</h1>
        <p class="subtitulo">Diseños para tu foro</p>
    </header>

    <div class="galeria">

        <!-- ======================================================= -->
        <!-- 👇 COPIA Y PEGA ESTE BLOQUE COMPLETO PARA AÑADIR UN TEMA 👇 -->
        <!-- ======================================================= -->
        <div class="tarjeta">
            
            <!-- PASO 1: PON LA IMAGEN DE TU TEMA AQUÍ -->
            <!-- Cambia el enlace de abajo (dentro de las comillas) por el de tu captura -->
            <img src="https://placehold.co/400x200/ffccdd/ff4d94?text=Tu+Captura+Aqui" alt="Captura del Tema">
            
            <div class="contenido">
                <!-- PASO 2: PON EL NOMBRE DE TU TEMA AQUÍ -->
                <h2>Nombre de tu Tema</h2>
                
                <!-- PASO 3: PON LA ETIQUETA (opcional) -->
                <span class="etiqueta">#Kawaii #Gore</span>
                
                <!-- PASO 4: PON TU ENLACE DE DESCARGA AQUÍ (Mega, Drive, etc) -->
                <!-- Cambia el enlace de abajo (dentro de las comillas) -->
                <a href="AQUI_VA_TU_ENLACE_DE_DESCARGA" target="_blank" class="boton-descarga">Descargar .zip</a>
            </div>
        </div>
        <!-- ======================================================= -->
        <!-- ☝️ FIN DEL BLOQUE DEL TEMA ☝️ -->
        <!-- ======================================================= -->



        <!-- AQUÍ ABAJO PUEDES PEGAR MÁS BLOQUES COMO EL DE ARRIBA SI QUIERES MÁS TEMAS -->
        
        <div class="tarjeta">
            <img src="https://placehold.co/400x200/ffccdd/ff4d94?text=Captura+Tema+2" alt="Captura del Tema">
            <div class="contenido">
                <h2>Ejemplo Tema 2</h2>
                <span class="etiqueta">#Foro #Oscuro</span>
                <a href="AQUI_VA_TU_ENLACE_DE_DESCARGA" target="_blank" class="boton-descarga">Descargar .zip</a>
            </div>
        </div>

        <div class="tarjeta">
            <img src="https://placehold.co/400x200/ffccdd/ff4d94?text=Captura+Tema+3" alt="Captura del Tema">
            <div class="contenido">
                <h2>Ejemplo Tema 3</h2>
                <span class="etiqueta">#Tierno #Pastel</span>
                <a href="AQUI_VA_TU_ENLACE_DE_DESCARGA" target="_blank" class="boton-descarga">Descargar .zip</a>
            </div>
        </div>

    </div>
</body>
</html>
